{% extends 'base.html' %}{% block title %}New Incident | Watchtower{% endblock %}{% block heading %}Create incident{% endblock %}{% block content %}<div class="form-narrow panel"><span class="eyebrow">CASE INTAKE</span><h2>New investigation</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required maxlength="160" placeholder="Describe the investigation"></label><label>Description<textarea name="description" rows="6" required maxlength="4000" placeholder="What brought this case to your attention?"></textarea></label><label>Severity<select name="severity" required>{% for severity in severities %}<option>{{ severity }}</option>{% endfor %}</select></label><div class="form-actions"><a class="button secondary" href="{{ url_for('incidents') }}">Cancel</a><button class="button primary">Create incident</button></div></form></div>{% endblock %}
